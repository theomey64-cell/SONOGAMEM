<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REFR'AIN — Sonoria</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#482066,#100719 70%);min-height:100vh;color:#f8edff;font-family:system-ui,Arial}main{max-width:970px;margin:auto;padding:28px 18px}a{color:#ffd69d}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(36px,7vw,68px);margin:45px 0 6px;color:#f7ce91}h2{margin-top:0}p{color:#d5c3e2;line-height:1.6}.panel{padding:27px;margin:20px 0;border:1px solid #8152a5;border-radius:24px;background:linear-gradient(145deg,#34174c,#1b102c);box-shadow:0 20px 45px #0005}button,input{font:inherit;border-radius:12px;padding:13px 16px}input{background:#130a21;color:white;border:1px solid #9163b3;max-width:100%;margin:5px}button{cursor:pointer;border:0;background:linear-gradient(100deg,#f5d79f,#bb65f4);color:#24102c;font-weight:800;margin:5px}button:hover{filter:brightness(1.13)}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:680px){.grid{grid-template-columns:1fr}}.muted{font-size:14px;color:#bea9cd}.clock{font-size:28px;color:#ffdd8b;font-weight:900}.pill{display:inline-block;padding:7px 13px;border:1px solid #a77bc4;border-radius:99px;margin:5px}.track{border:1px solid #8055a3;border-radius:16px;padding:18px;margin:12px 0}audio{width:100%;margin:8px 0}#message{color:#ffdb94;min-height:24px}.progress{height:7px;background:#3b2352;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#d3a4ff;transition:width .2s}</style></head><body><main><header><a href="/">← Retour à SONOR</a><span>🎙 REFR'AIN</span></header><h1>REFR'AIN</h1><p>Une mélodie. Deux minutes. Tes paroles. Le chef lance l'instrumental, les joueurs enregistrent leur version et tout le monde écoute les performances.</p><section id="entry" class="grid"><div class="panel"><h2>Créer un salon</h2><input id="createName" placeholder="Ton pseudo" maxlength="22"><button onclick="request('rf:create',{name:val('createName')})">Créer ↗</button></div><div class="panel"><h2>Rejoindre un salon</h2><input id="joinName" placeholder="Ton pseudo" maxlength="22"><input id="joinCode" placeholder="CODE" maxlength="6"><button onclick="request('rf:join',{name:val('joinName'),code:val('joinCode')})">Rejoindre ↗</button></div></section><section id="game" class="hidden"><div class="panel"><h2>Salon <span id="code"></span></h2><div id="players"></div><p id="stage"></p><div class="clock" id="clock"></div></div><div class="panel" id="content"></div></section><p id="message" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),val=id=>$(id).value.trim();let me=null,state=null,recorder=null,chunks=[],recorded=null,stream=null,recordStart=0,playing=-1,playTimer=null;const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(s){$('message').textContent=s||''}function request(ev,data){socket.emit(ev,data,res=>{if(res?.error)message(res.error);else{message('');if(res?.id)me=res.id}})}socket.on('rf:state',s=>{const prev=state;state=s;$('entry').classList.add('hidden');$('game').classList.remove('hidden');if(!prev||prev.phase!==s.phase){playing=-1;clearTimeout(playTimer);stopRecording();if(s.phase==='record')recorded=null;}render()});socket.on('disconnect',()=>message('Connexion perdue. Recharge la page et rejoins à nouveau.'));
function render(){const s=state;if(!s)return;$('code').textContent=s.code;$('players').innerHTML=s.players.map(p=>'<span class="pill">'+escapeHTML(p.name)+(p.id===s.host?' 👑':'')+'</span>').join('');$('stage').textContent={lobby:'Préparation du salon',record:'Enregistre ta performance',listen:'Écoute des performances',vote:'Vote pour la meilleure interprétation',results:'Résultats'}[s.phase];let html='';if(s.phase==='lobby')html=me===s.host?'<h2>Choisis l’instrumental</h2><p>Charge un extrait instrumental MP3, WAV ou OGG court (environ 2 Mo max). Utilise une piste que tu as le droit de diffuser.</p><input id="backingFile" type="file" accept="audio/*" onchange="uploadBacking(this)"><p>'+(s.instrumental?'✓ Instrumental prêt':'En attente du fichier')+'</p><button onclick="request(\'rf:start\',{})" '+(!s.instrumental||s.players.length<2?'disabled':'')+'>Démarrer les 2 minutes →</button>':'<h2>Le chef prépare l’instrumental…</h2><p>Attends le lancement.</p>';if(s.phase==='record')html='<h2>🎤 À toi de chanter !</h2><p>Écoute l’instrumental, invente des paroles ou reproduis celles de la chanson. Enregistre ta voix (20 secondes maximum), puis valide.</p><audio controls src="'+s.instrumental+'"></audio><p>'+s.ready+' / '+s.total+' performances validées</p>'+(me===s.host?'<p>Tu es le chef : tu ne chantes pas cette manche.</p>':s.players.find(p=>p.id===me)&&s.ready===s.total?'<p>Les performances arrivent…</p>':'<button id="startRec" onclick="startRecording()">● Enregistrer ma voix</button><button onclick="stopRecording()">■ Arrêter</button><div id="recordPreview"></div><button onclick="submitVoice()">✓ Valider ma performance</button>');if(s.phase==='listen'||s.phase==='vote'||s.phase==='results'){html='<h2>🎶 Les performances</h2><p>L’instrumental et la voix démarrent ensemble. Utilise un casque pour limiter les échos pendant l’enregistrement.</p>';s.performances.forEach((p,i)=>{html+='<div class="track"><h3>Performance '+(i+1)+'</h3><button onclick="playPerformance('+i+')">▶ Écouter le mix</button><div class="progress"><div id="bar'+i+'"></div></div>'+(s.phase==='vote'?'<button onclick="request(\'rf:vote\','+i+')">♥ Voter</button>':'')+(s.phase==='results'?'<p>'+escapeHTML(s.results[i]?.name||'')+' · '+(s.results[i]?.votes||0)+' vote(s)</p>':'')+'</div>'});if(s.phase==='results')html+='<p>Pour une nouvelle partie, crée un nouveau salon.</p>';} $('content').innerHTML=html;updateClock();}
function updateClock(){if(!state)return;const sec=state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):0;$('clock').textContent=state.deadline?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):'';}setInterval(updateClock,500);
function asData(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}async function uploadBacking(input){const file=input.files[0];if(!file)return;if(file.size>2000000){message('Instrumental limité à 2 Mo. Coupe ou compresse ton extrait.');return;}try{request('rf:instrumental',await asData(file))}catch(e){message(e.message)}}
async function startRecording(){if(recorder&&recorder.state==='recording')return;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});chunks=[];const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType});recorded=await asData(blob);stream?.getTracks().forEach(t=>t.stop());const preview=$('recordPreview');if(preview)preview.innerHTML='<p>✓ Enregistrement prêt</p><audio controls src="'+recorded+'"></audio>';if(blob.size>950000)message('Enregistrement trop volumineux, recommence plus court.');};recorder.start();recordStart=Date.now();message('Micro actif : chante maintenant !');setTimeout(()=>{if(recorder?.state==='recording')stopRecording()},20000);}catch(e){message('Autorise le micro dans ton navigateur (HTTPS requis) : '+e.message)}}function stopRecording(){if(recorder?.state==='recording')recorder.stop()}function submitVoice(){if(!recorded)return message('Enregistre ta voix avant de valider.');request('rf:voice',recorded);recorded=null;}
function playPerformance(i){if(!state?.performances[i])return;clearTimeout(playTimer);document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0});const backing=new Audio(state.instrumental),voice=new Audio(state.performances[i].voice);backing.volume=.65;voice.volume=1;backing.play().catch(()=>message('Clique de nouveau pour activer le son'));voice.play().catch(()=>message('Lecture audio bloquée par le navigateur'));const stop=()=>{backing.pause();voice.pause()};playTimer=setTimeout(stop,20000);backing.onended=()=>voice.pause();}
</script></body></html>
